<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Vertical local ad</title>
<style>
@font-face{font-family:K;src:url(fonts/la-400.woff2);font-weight:400;unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212}
@font-face{font-family:K;src:url(fonts/la-700.woff2);font-weight:700;unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212}
@font-face{font-family:K;src:url(fonts/la-900.woff2);font-weight:900;unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212}
@font-face{font-family:K;src:url(fonts/ar-400.woff2);font-weight:400;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:K;src:url(fonts/ar-700.woff2);font-weight:700;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:K;src:url(fonts/ar-900.woff2);font-weight:900;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
:root{--navy:#21418a;--mag:#c2185b;--gold:#f2b829;--blue:#1a6ad2;--red:#e2205a;--cream:#fbf6ec;--ink:#1b2340;--mute:#7a8099}
html,body{margin:0;overflow:hidden;background:var(--cream)}
body{font-family:K,sans-serif;color:var(--ink);width:1080px;height:1920px}
#stage{position:absolute;inset:0;overflow:hidden}
.sc{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.line{width:max-content;margin:0 auto;white-space:nowrap;line-height:1.35}
.w{display:inline-block;overflow:hidden;padding:.14em .02em .26em;margin:-.14em .1em -.26em;vertical-align:top}
.wi{display:inline-block;transform-origin:50% 100%}
.i3{display:block;filter:drop-shadow(0 22px 22px rgba(20,30,60,.28))}
.blob{position:absolute;border-radius:50%;filter:blur(60px)}
.card{background:#fff;border-radius:44px;box-shadow:0 30px 80px rgba(33,65,138,.16),0 4px 14px rgba(33,65,138,.08)}
.pill{display:inline-flex;align-items:center;gap:14px;border-radius:999px;font-weight:900}
.key{width:76px;height:96px;border-radius:16px;background:#fff;box-shadow:0 3px 0 rgba(33,65,138,.18);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:var(--ink)}
.center{left:0;right:0;text-align:center}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const FPS = 30, DUR = 53, W = 1080, H = 1920;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = x => { x = clamp(x); return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const ei = x => { x = clamp(x); return x * x * x; };
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const prog = (t, a, b, e = eo) => e((t - a) / (b - a));
function spring(t, k = 200, d = 22) { if (t <= 0) return 0; const w0 = Math.sqrt(k), z = d / (2 * w0); if (z >= 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t); const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + z * w0 / wd * Math.sin(wd * t)); }
const stage = document.getElementById('stage');
function el(cls, parent, tag = 'div') { const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.appendChild(e); return e; }
function css(e, s) { e.style.cssText += ';' + s; return e; }
function words(parent, text) {
  const out = [];
  text.split('\n').forEach((line, li) => {
    const L = el('line', parent);
    line.trim().split(/\s+/).forEach(w => {
      let c = 'wi', m, col = null;
      if ((m = w.match(/^\*(.+)\*(.*)$/))) { col = 'var(--mag)'; w = m[1] + m[2]; }
      else if ((m = w.match(/^\^(.+)\^(.*)$/))) { col = 'var(--gold)'; w = m[1] + m[2]; }
      else if ((m = w.match(/^_(.+)_(.*)$/))) { col = 'var(--navy)'; w = m[1] + m[2]; }
      const o = el('w', L, 'span'); const i = el(c, o, 'span'); i.textContent = w; if (col) i.style.color = col; i._line = li; out.push(i);
    });
  });
  return out;
}
function animWords(ws, lt, t0, st = .08, d = .7) { ws.forEach((w, i) => { const p = eo((lt - t0 - i * st) / d); w.style.transform = `translateY(${(1 - p) * 118}%) rotate(${(1 - p) * -4}deg)`; }); }
const IMGS = [];
function img3(name, parent, size) { const i = el('i3', parent, 'img'); i.src = 'icons/' + name + '.webp'; i.width = size; i.height = size; IMGS.push(i); return i; }
function float3(i, lt, t0, seed = 0, amp = 1) { const m = spring(lt - t0, 220, 17); i.style.opacity = clamp(m * 3); i.style.transform = `translateY(${(1 - m) * 80 + Math.sin(lt * 1.8 + seed) * 12 * amp}px) rotate(${Math.sin(lt * 1.3 + seed) * 6 * amp}deg) scale(${.3 + .7 * m})`; }
function pop(e, lt, t0, k = 260, d = 20, extra = '') { const m = spring(lt - t0, k, d); e.style.opacity = clamp(m * 3); e.style.transform = `scale(${m}) ${extra}`; return m; }
function rise(e, lt, t0, dist = 60) { const m = spring(lt - t0, 170, 24); e.style.opacity = clamp(m * 2); e.style.transform = `translateY(${(1 - m) * dist}px)`; return m; }
function blobs(root, cols) {
  return cols.map((c, i) => { const b = el('blob', root); css(b, `width:${520 + i * 80}px;height:${520 + i * 80}px;background:${c};opacity:.32`); b._i = i; return b; });
}
function drift(bs, t) { bs.forEach(b => { const i = b._i; b.style.left = (lerp(-180, 760, (i * .37) % 1) + Math.sin(t * .35 + i * 2) * 70) + 'px'; b.style.top = (lerp(-120, 1500, (i * .61 + .1) % 1) + Math.cos(t * .3 + i) * 90) + 'px'; }); }

// ---------- logo (vector rebuild of the academy mark) ----------
function logo(parent, size) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 200 200'); s.setAttribute('width', size); s.setAttribute('height', size);
  // PLACEHOLDER MARK: redraw the client's logo here as vector (keep the class names so logoAnim works),
  // or use <image href="brand/logo.png" .../> inside the circle for a high-res PNG.
  s.innerHTML = `
  <circle class="lg-bg" cx="100" cy="100" r="91" fill="#fff"/>
  <circle class="lg-o" cx="100" cy="100" r="91" fill="none" stroke="#f2b829" stroke-width="9" pathLength="1" stroke-dasharray="1"/>
  <circle class="lg-i" cx="100" cy="100" r="80" fill="none" stroke="#21418a" stroke-width="6" pathLength="1" stroke-dasharray="1"/>
  <g class="lg-k1"><circle cx="82" cy="88" r="16" fill="#1a6ad2"/></g>
  <g class="lg-k2"><circle cx="118" cy="88" r="16" fill="#c2185b"/></g>
  <path class="lg-st" d="M100 34 L104 45 L116 45 L106.5 52 L110 63 L100 56.5 L90 63 L93.5 52 L84 45 L96 45 Z" fill="#f2b829"/>
  <g class="lg-bk"><path d="M52 124 Q100 108 148 124 L148 136 Q100 120 52 136 Z" fill="#21418a"/></g>`;
  parent.appendChild(s);
  const q = c => s.querySelector(c);
  return { s, o: q('.lg-o'), i: q('.lg-i'), k1: q('.lg-k1'), k2: q('.lg-k2'), st: q('.lg-st'), bk: q('.lg-bk') };
}
function logoAnim(L, lt, t0) {
  L.o.style.strokeDashoffset = 1 - prog(lt, t0, t0 + .9, eio);
  L.i.style.strokeDashoffset = 1 - prog(lt, t0 + .15, t0 + 1.0, eio);
  const b = spring(lt - t0 - .35, 200, 22); L.bk.style.transform = `translateY(${(1 - b) * 30}px)`; L.bk.style.opacity = clamp(b * 2);
  [L.k1, L.k2].forEach((k, j) => { const m = spring(lt - t0 - .6 - j * .15, 260, 16); k.style.transformOrigin = '100px 120px'; k.style.transformBox = 'view-box'; k.style.transform = `scale(${m}) translateY(${Math.sin(lt * 3 + j) * 1.5}px)`; });
  const sm = spring(lt - t0 - 1.0, 240, 14); L.st.style.transformOrigin = '100px 49px'; L.st.style.transform = `scale(${sm}) rotate(${(1 - sm) * -180 + Math.sin(lt * 2) * 6}deg)`;
}
function logoStatic(L) { L.o.style.strokeDashoffset = 0; L.i.style.strokeDashoffset = 0; }

// ---------- scenes ----------
// ================= BRAND: edit only this block for a new client =================
const BRAND = {
  query: 'أحسن [الخدمة] قريبة مني',                     // what the viewer "searches"
  suggestions: ['[الخدمة] قريبة مني', 'أحسن [الخدمة]', '[الخدمة] بأسعار مناسبة'],
  hook: 'بتدوّر على\n*[الخدمة]* صح؟',                    // *x* = accent 2, _x_ = accent 1, ^x^ = gold
  name1: '[اسم المكان]', name2: '[النشاط]',             // two-colour name (accent 1 / accent 2)
  badge: '[الميزة الأساسية]',                            // gold pill
  slogan: '[الشعار]',
  addrShort: '[العنوان المختصر]',
  addrFull: '[العنوان بالتفصيل]',
  addrNote: '[أمام معلم 1 · ناحية معلم 2]',
  streetMain: '[الشارع الرئيسي]', streetSide: '[الشارع الجانبي]',
  landmarks: [['[معلم 1]', 700, 860], ['[معلم 2]', 150, 760], ['[معلم 3]', 640, 1050]],
  highlight: { word: 'ميزة', tiles: ['1', '2', '3', '4'], line: '[جملة عن الميزة الأساسية]' },   // tiles pop, then the word builds from its own letters
  servicesTitle: '[عندنا]…',
  services: [['[خدمة 1]', 'star', ''], ['[خدمة 2]', 'sparkles', ''], ['[خدمة 3]', 'heart', ''], ['[خدمة 4]', 'target', ''], ['[خدمة 5]', 'bulb', ''], ['[خدمة 6]', 'medal', '']],
  team: 'فريق من *أمهر*\n_المتخصصين_',
  teamIcons: ['person', 'student', 'person'],
  valuesTitle: '[إحنا مش بس…]\n[إحنا…]',
  values: [['[قيمة 1]', 'medal', 'var(--navy)'], ['[قيمة 2]', 'heart', 'var(--mag)']],
  valuesLine: '[جملة القيم]',
  placeTitle: 'مكاننا *قريب* منك',
  manager: '',                                           // e.g. 'بإدارة: <b style="color:var(--navy)">[الاسم]</b>' or '' to hide
  cta: '[احجز دلوقتي]',
  phoneLabel: 'رقم التواصل',
  phoneGroups: ['010', '0000', '0000'],                  // light up one by one as the VO reads them
};
// =================================================================================
const S = []; function sc(t0, t1, type, o = {}) { S.push(Object.assign({ t0, t1, type }, o)); }
const T = {};
const QUERY = BRAND.query;
const KB = ['ض ص ث ق ف غ ع ه خ ح ج', 'ش س ي ب ل ا ت ن م ك ط', 'ئ ء ؤ ر ى ة و ز ظ د'];
const TY0 = .6, TYS = .12; // typing start, sec per char
const BAR_Y1 = 560, BAR_Y2 = 210;

T.search = {
  build(s) {
    s.root.style.background = 'var(--cream)'; s.bl = blobs(s.root, ['#f2b829', '#c2185b', '#1a6ad2']);
    s.hook = el('abs center', s.root); css(s.hook, 'top:250px;font-size:84px;font-weight:900;line-height:1.3'); s.hw = words(s.hook, BRAND.hook);
    s.bar = el('card abs', s.root); css(s.bar, 'left:80px;width:920px;height:150px;display:flex;align-items:center;gap:26px;padding:0 44px;box-sizing:border-box;border-radius:75px;font-size:50px;font-weight:700');
    const mg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); mg.setAttribute('viewBox', '0 0 40 40'); mg.setAttribute('width', 58); mg.setAttribute('height', 58); mg.innerHTML = '<circle cx="17" cy="17" r="11" stroke="#21418a" stroke-width="4.5" fill="none"/><path d="M25 25 L35 35" stroke="#21418a" stroke-width="4.5" stroke-linecap="round"/>'; s.bar.appendChild(mg);
    s.q = el('', s.bar, 'span'); s.cr = el('', s.bar, 'span'); css(s.cr, 'width:5px;height:60px;background:var(--mag);border-radius:3px;margin-right:-20px');
    s.sug = el('card abs', s.root); css(s.sug, 'left:80px;width:920px;padding:18px 44px;box-sizing:border-box;top:740px;font-size:40px;color:var(--mute);font-weight:700');
    s.sl = BRAND.suggestions.map(t => { const r = el('', s.sug); css(r, 'padding:16px 0;border-bottom:2px solid #eef0f6'); r.textContent = t; return r; });
    s.sl[s.sl.length - 1].style.borderBottom = 'none';
    s.kb = el('abs', s.root); css(s.kb, 'left:0;right:0;top:1180px;padding:30px 20px 60px;background:#e9edf6;border-radius:40px 40px 0 0;display:flex;flex-direction:column;gap:18px;align-items:center;height:620px;box-sizing:border-box');
    s.keys = {};
    KB.forEach(row => { const r = el('', s.kb); css(r, 'display:flex;gap:10px;direction:rtl'); row.split(' ').forEach(ch => { const k = el('key', r); k.textContent = ch; s.keys[ch] = k; }); });
    const lr = el('', s.kb); css(lr, 'display:flex;gap:12px;align-items:center');
    s.space = el('key', lr); css(s.space, 'width:520px;font-size:34px;color:var(--mute)'); s.space.textContent = 'مسافة';
    s.go = el('key', lr); css(s.go, 'width:220px;background:var(--navy);color:#fff;font-size:38px'); s.go.textContent = 'بحث';
    s.end = TY0 + QUERY.length * TYS; // ~4.1
  },
  keyFor(ch) { if ('أإآ'.includes(ch)) return 'ا'; return ch; },
  upd(s, lt) {
    drift(s.bl, lt);
    animWords(s.hw, lt, .05, .1);
    const hookOut = prog(lt, 3.0, 3.4, ei); s.hook.style.opacity = 1 - hookOut;
    // bar enters, then rises to the top for the results
    const be = spring(lt - .15, 170, 24), up = prog(lt, 3.35, 4.2, eio);
    s.bar.style.top = lerp(BAR_Y1, BAR_Y2, up) + 'px'; s.bar.style.opacity = clamp(be * 2); s.bar.style.transform = `scale(${.9 + .1 * be})`;
    s.q.textContent = QUERY.slice(0, Math.floor(clamp((lt - TY0) / TYS, 0, QUERY.length)));
    s.cr.style.opacity = (lt < s.end + .2 || Math.floor(lt * 4.8) % 2 === 0) ? 1 : 0;
    const sg = spring(lt - 1.3, 170, 24) * (1 - prog(lt, 3.0, 3.4, ei)); s.sug.style.opacity = clamp(sg * 2); s.sug.style.transform = `translateY(${(1 - sg) * 40}px)`;
    s.sl.forEach((r, i) => r.style.opacity = prog(lt, 1.3 + i * .35, 1.6 + i * .35));
    const kbin = spring(lt - .3, 170, 26), kbout = prog(lt, 3.1, 3.6, ei); s.kb.style.transform = `translateY(${(1 - kbin) * 700 + kbout * 700}px)`;
    Object.values(s.keys).forEach(k => { k.style.background = '#fff'; k.style.color = 'var(--ink)'; k.style.transform = 'none'; });
    const ci = Math.floor((lt - TY0) / TYS);
    if (ci >= 0 && ci < QUERY.length && (lt - TY0) % TYS < .11) {
      const ch = QUERY[ci]; const k = ch === ' ' ? s.space : s.keys[T.search.keyFor(ch)];
      if (k) { k.style.background = 'var(--navy)'; k.style.color = '#fff'; k.style.transform = 'scale(.92)'; }
    }
    const gp = lt > 2.85 && lt < 3.1; s.go.style.transform = gp ? 'scale(.9)' : 'none'; s.go.style.background = gp ? 'var(--mag)' : 'var(--navy)';
  },
  cues(s) { const c = [[.15, 'swish', .3]]; for (let i = 0; i < QUERY.length; i++) c.push([TY0 + i * TYS, 'tick', .4]); c.push([2.85, 'pop', .6], [3.35, 'whoosh', .4]); return c; }
};

T.result = {
  build(s) {
    s.root.style.background = 'var(--cream)'; s.bl = blobs(s.root, ['#f2b829', '#c2185b', '#1a6ad2']);
    // same search bar, already at the top (continuity)
    const bar = el('card abs', s.root); css(bar, `left:80px;width:920px;height:150px;top:${BAR_Y2}px;display:flex;align-items:center;gap:26px;padding:0 44px;box-sizing:border-box;border-radius:75px;font-size:50px;font-weight:700`);
    bar.innerHTML = '<svg viewBox="0 0 40 40" width="58" height="58"><circle cx="17" cy="17" r="11" stroke="#21418a" stroke-width="4.5" fill="none"/><path d="M25 25 L35 35" stroke="#21418a" stroke-width="4.5" stroke-linecap="round"/></svg><span>' + QUERY + '</span>';
    s.c = el('card abs', s.root); css(s.c, 'left:60px;width:960px;top:430px;padding:50px 50px 44px;box-sizing:border-box;display:flex;flex-direction:column;gap:26px');
    const top = el('', s.c); css(top, 'display:flex;align-items:center;gap:34px');
    s.lw = el('', top); css(s.lw, 'flex:none;position:relative'); s.L = logo(s.lw, 210); logoStatic(s.L);
    const tx = el('', top); css(tx, 'display:flex;flex-direction:column;gap:12px');
    s.nm = el('', tx); css(s.nm, 'font-size:62px;font-weight:900;line-height:1.25'); s.nm.innerHTML = `<span style="color:var(--navy)">${BRAND.name1}</span><br><span style="color:var(--mag)">${BRAND.name2}</span>`;
    s.badge = el('pill', tx); css(s.badge, 'align-self:flex-start;background:var(--gold);color:var(--ink);font-size:36px;padding:8px 30px'); s.badge.textContent = BRAND.badge;
    s.slog = el('', s.c); css(s.slog, 'font-size:40px;font-weight:700;color:var(--mute)'); s.slog.textContent = BRAND.slogan;
    s.addr = el('', s.c); css(s.addr, 'display:flex;align-items:center;gap:16px;font-size:36px;font-weight:700;color:var(--ink)');
    s.pin = img3('pin', s.addr, 64); el('', s.addr, 'span').textContent = BRAND.addrShort;
    const btns = el('', s.c); css(btns, 'display:flex;gap:20px;margin-top:6px');
    s.btns = [['phone', 'اتصال'], ['pin', 'الاتجاهات'], ['star', 'حفظ']].map(([ic, t]) => { const b = el('pill', btns); css(b, 'background:#eef2fb;color:var(--navy);font-size:36px;padding:14px 30px'); const im = img3(ic, b, 50); el('', b, 'span').textContent = t; b._im = im; return b; });
    s.ghost = [0, 1].map(i => { const g = el('card abs', s.root); css(g, `left:60px;width:960px;height:200px;top:${1290 + i * 240}px;opacity:.5;display:flex;flex-direction:column;gap:24px;padding:44px 50px;box-sizing:border-box`); [70, 45].forEach(w => css(el('', g), `height:30px;border-radius:15px;background:#e6e9f2;width:${w}%`)); return g; });
    s.tap = el('abs', s.root); css(s.tap, 'width:150px;height:150px;border-radius:50%;border:8px solid var(--mag);opacity:0');
    s.flood = el('abs', s.root); css(s.flood, 'border-radius:50%;background:var(--navy);width:10px;height:10px;opacity:0;z-index:5');
  },
  upd(s, lt) {
    drift(s.bl, lt + 6);
    const m = spring(lt - .1, 170, 22); s.c.style.opacity = clamp(m * 2); s.c.style.transform = `translateY(${(1 - m) * 160}px) scale(${.94 + .06 * m})`;
    s.badge.style.transform = `scale(${spring(lt - .45, 260, 18)})`;
    s.btns.forEach((b, i) => { pop(b, lt, .65 + i * .12); });
    s.ghost.forEach((g, i) => { const k = spring(lt - .4 - i * .15, 170, 24); g.style.opacity = .55 * clamp(k * 2); g.style.transform = `translateY(${(1 - k) * 120}px)`; });
    // tap on the logo, then dive into it
    const r = s.lw.getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2; s.cx = cx; s.cy = cy;
    const tp = clamp((lt - 1.4) / .45); s.tap.style.left = (cx - 75) + 'px'; s.tap.style.top = (cy - 75) + 'px'; s.tap.style.opacity = tp > 0 && tp < 1 ? 1 - tp : 0; s.tap.style.transform = `scale(${.6 + tp * .9})`;
    s.lw.style.transform = `scale(${lt > 1.4 && lt < 1.65 ? .94 : 1})`;
    const R = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)) * 1.05; const f = prog(lt, 1.72, 2.2, eio);
    s.flood.style.opacity = f > 0 ? 1 : 0; s.flood.style.left = (cx - 5) + 'px'; s.flood.style.top = (cy - 5) + 'px'; s.flood.style.transform = `scale(${f * R / 5})`;
  },
  cues() { return [[.1, 'whoosh', .4], [.45, 'pop', .5], [.65, 'pop', .35], [.77, 'pop', .35], [.89, 'pop', .35], [1.4, 'pop', .7], [1.72, 'rise', .6]]; }
};

const TILE = ['#f2b829', '#c2185b', '#1a6ad2', '#e2205a'];
T.highlight = {
  build(s) {
    s.root.style.background = 'radial-gradient(ellipse at 50% 40%,#2c54a8 0%,#21418a 55%,#172f66 100%)';
    s.lab = el('abs center', s.root); css(s.lab, 'top:430px'); s.lp = el('pill', s.lab); css(s.lp, 'background:var(--gold);color:var(--ink);font-size:56px;padding:14px 44px'); s.lp.textContent = BRAND.badge;
    s.tiles = BRAND.highlight.tiles.map((ch, i) => { const t = el('abs', s.root); css(t, `width:200px;height:200px;border-radius:44px;background:${TILE[i]};color:#fff;font-size:130px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 0 rgba(0,0,0,.18);left:${790 - i * 230}px;top:840px;line-height:1`); t.textContent = ch; return t; });

function buildAll() {
  S.forEach((s, i) => { s.root = el('sc', stage); s.root.style.zIndex = 10 + i; T[s.type].build(s); s.root.style.display = 'none'; });
  window.CUES = [];
  S.forEach(s => T[s.type].cues(s).forEach(([lt, k, g]) => { if (lt < s.t1 - s.t0 + .6) CUES.push([+(s.t0 + lt).toFixed(3), k, g]); }));
  CUES.sort((a, b) => a[0] - b[0]);
}
window.seek = (t) => {
  S.forEach((s, i) => {
    const lt = t - s.t0, d = s.t1 - s.t0, next = S[i + 1];
    const visible = lt >= 0 && (lt < d || (next && t < next.t0 + .6));
    if (!visible) { s.root.style.display = 'none'; return; }
    s.root.style.display = 'block';
    T[s.type].upd(s, lt, d);
    // entrance: circle reveal (first scene and the flood-dive scene come in clean)
    if (i > 0 && s.reveal !== 'flood') {
      const p = prog(lt, 0, .6, eio); const prev = S[i - 1];
      const cx = W / 2, cy = H * .55; const R = Math.hypot(W, H) * .62;
      s.root.style.clipPath = p < 1 ? `circle(${p * R}px at ${cx}px ${cy}px)` : 'none';
    } else s.root.style.clipPath = 'none';
  });
};
