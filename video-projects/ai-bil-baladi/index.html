<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>AI bil-baladi</title>
<style>
@font-face{font-family:K;src:url(fonts/la-400.woff2);font-weight:400;unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212}
@font-face{font-family:K;src:url(fonts/la-700.woff2);font-weight:700;unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212}
@font-face{font-family:K;src:url(fonts/la-900.woff2);font-weight:900;unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212}
@font-face{font-family:K;src:url(fonts/ar-400.woff2);font-weight:400;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:K;src:url(fonts/ar-700.woff2);font-weight:700;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:K;src:url(fonts/ar-900.woff2);font-weight:900;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
:root{--bg:#0b0b0c;--ink:#f2f1ec;--mute:#7c7c84;--acc:#cdf24f;--bad:#ff5a4e;--card:#151518;--line:#2a2a30}
html,body{margin:0;background:var(--bg);overflow:hidden}
body{font-family:K,sans-serif;color:var(--ink);width:1920px;height:1080px}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
#dots{position:absolute;inset:-100px;background-image:radial-gradient(rgba(255,255,255,.075) 1.6px,transparent 1.8px);background-size:44px 44px;z-index:1}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.6) 100%);z-index:3}
#orb{position:absolute;left:0;top:0;width:1000px;height:1000px;margin:-500px 0 0 -500px;border-radius:50%;background:radial-gradient(circle,rgba(205,242,79,.20) 0%,rgba(205,242,79,.07) 35%,rgba(205,242,79,0) 66%);z-index:2}
#grain{position:absolute;inset:0;width:1920px;height:1080px;z-index:40;opacity:.07;mix-blend-mode:screen;image-rendering:pixelated}
#chap{position:absolute;top:56px;right:80px;z-index:30;font-size:30px;font-weight:700;color:var(--mute);display:flex;gap:14px;align-items:center}
#chap b{color:var(--acc);font-weight:900;direction:ltr}
#fade{position:absolute;inset:0;background:#000;z-index:50;opacity:0}
.sc{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center}
.line{width:max-content;margin:0 auto;white-space:nowrap;line-height:1.35}
.w{display:inline-block;overflow:hidden;padding:.14em .02em .26em;margin:-.14em .12em -.26em;vertical-align:top}
.wi{display:inline-block;transform-origin:50% 100%}
.acc{color:var(--acc)}
.mu{color:var(--mute)}
.main{font-weight:900;font-size:120px;letter-spacing:0}
.sub{font-weight:700;font-size:54px;color:var(--mute)}
.card{background:var(--card);border:2px solid var(--line);border-radius:28px}
.small{font-size:30px;font-weight:700;color:var(--mute)}
svg{overflow:visible}
</style>
</head>
<body>
<div id="stage">
  <div id="dots"></div>
  <div id="orb"></div>
  <div id="vig"></div>
  <div id="chap"><b></b><span></span></div>
  <canvas id="grain" width="480" height="270"></canvas>
  <div id="fade"></div>
</div>
<script>
// ---------- math ----------
const FPS = 30, DUR = 480, W = 1920, H = 1080;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = x => { x = clamp(x); return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const ei = x => { x = clamp(x); return x * x * x; };
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const prog = (t, a, b, e = eo) => e((t - a) / (b - a));
function spring(t, k = 200, d = 22) { // underdamped step response, damping ratio ~0.78
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (z >= 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  const wd = w0 * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + z * w0 / wd * Math.sin(wd * t));
}
function rng(seed) { let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = (n) => rng(n * 9973 + 17)();

// ---------- dom helpers ----------
const stage = document.getElementById('stage');
function el(cls, parent, tag = 'div') { const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.appendChild(e); return e; }
function words(parent, text) {
  const out = [];
  text.split('\n').forEach(line => {
    const L = el('line', parent);
    line.trim().split(/\s+/).forEach(w => {
      let c = 'wi';
      let m;
      if ((m = w.match(/^\*(.+)\*(.*)$/))) { c += ' acc'; w = m[1] + m[2]; }
      else if ((m = w.match(/^~(.+)~(.*)$/))) { c += ' mu'; w = m[1] + m[2]; }
      const o = el('w', L, 'span'); const i = el(c, o, 'span'); i.textContent = w; out.push(i);
    });
  });
  return out;
}
function animWords(ws, lt, t0, st = .08, d = .8) {
  ws.forEach((w, i) => {
    const p = eo((lt - t0 - i * st) / d);
    w.style.transform = `translateY(${(1 - p) * 118}%) rotate(${(1 - p) * -4}deg)`;
  });
}
function fit(box, maxW) {
  let m = 0; box.querySelectorAll('.line').forEach(l => m = Math.max(m, l.offsetWidth));
  if (m > maxW) { const fs = parseFloat(getComputedStyle(box).fontSize); box.style.fontSize = (fs * maxW / m) + 'px'; }
}
const SVGNS = 'http://www.w3.org/2000/svg';
const ICONS = {
  pen: ['M22 100 L30 72 L86 16 L104 34 L48 90 Z', 'M74 28 L92 46'],
  brush: ['M104 14 L58 60', 'M58 60 C42 54 26 64 26 80 C26 92 18 100 10 104 C36 108 62 100 63 78 Z'],
  code: ['M40 30 L12 60 L40 90', 'M80 30 L108 60 L80 90', 'M68 20 L52 100'],
  spark: ['M60 8 L70 50 L112 60 L70 70 L60 112 L50 70 L8 60 L50 50 Z'],
  eye: ['M8 60 C30 22 90 22 112 60 C90 98 30 98 8 60 Z', 'M60 44 A16 16 0 1 1 59.9 44 Z'],
  book: ['M60 26 C44 16 24 16 10 20 L10 98 C24 94 44 94 60 104 C76 94 96 94 110 98 L110 20 C96 16 76 16 60 26 Z', 'M60 26 L60 104'],
  check: ['M28 62 L50 84 L94 36'],
  cross: ['M34 34 L86 86', 'M86 34 L34 86'],
  play: ['M44 30 L92 60 L44 90 Z'],
};
function icon(name, parent, size = 120, color = 'var(--acc)', sw = 7) {
  const s = document.createElementNS(SVGNS, 'svg'); s.setAttribute('viewBox', '0 0 120 120'); s.setAttribute('width', size); s.setAttribute('height', size);
  const ps = ICONS[name].map(d => { const p = document.createElementNS(SVGNS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', color); p.setAttribute('stroke-width', sw); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round'); p.setAttribute('pathLength', '1'); p.style.strokeDasharray = '1'; s.appendChild(p); return p; });
  parent.appendChild(s); return { svg: s, ps };
}
function draw(ic, p) { ic.ps.forEach((q, i) => q.style.strokeDashoffset = 1 - clamp(p * ic.ps.length - i)); }
function typed(str, lt, t0, cps = 1 / .055) { const n = Math.floor(clamp((lt - t0) * cps, 0, str.length)); return str.slice(0, n); }
function caret(lt, active) { return (active || Math.floor(lt * 2.4 * 2) % 2 === 0) ? 1 : 0; }

// ---------- scenes ----------
const S = [];
function sc(t0, t1, type, o = {}) { S.push(Object.assign({ t0, t1, type }, o)); }
const T = {}; // type -> {build(s), upd(s,lt,d), cues(s)->[[lt,kind,gain]]}

T.text = {
  build(s) {
    if (s.sub) { s.subBox = el('sub', s.root); s.sw = words(s.subBox, s.sub); }
    s.box = el('main', s.root); s.box.style.fontSize = (s.size || 112) + 'px';
    s.ws = words(s.box, s.lines); fit(s.box, 1640);
  },
  upd(s, lt) { if (s.sw) animWords(s.sw, lt, .05); animWords(s.ws, lt, s.sub ? .45 : .1); },
  cues(s) { return s.hero ? [[.1, 'hit', .9]] : [[.05, 'swish', .35]]; }
};

T.hook = {
  build(s) {
    s.top = el('sub', s.root); s.top.style.cssText = 'font-size:84px;color:var(--ink)'; s.tw = words(s.top, 'الذكاء الاصطناعي');
    s.row = el('', s.root); s.row.style.cssText = 'display:flex;gap:56px;align-items:center;font-weight:900;font-size:300px;line-height:1.25';
    s.mish = el('acc', s.row, 'span'); s.mish.textContent = 'مش';
    s.zw = el('', s.row, 'span'); s.zw.style.position = 'relative';
    s.zm = el('w', s.zw, 'span'); s.zi = el('wi', s.zm, 'span'); s.zi.textContent = 'ذكي';
    s.strike = el('', s.zw); s.strike.style.cssText = 'position:absolute;left:-4%;right:-4%;top:56%;height:22px;border-radius:11px;background:var(--bad);transform-origin:100% 50%';
    s.shift = (s.mish.offsetWidth + 56) / 2;
  },
  upd(s, lt) {
    animWords(s.tw, lt, -.6);
    const p = eo((lt - .5) / .8); s.zi.style.transform = `translateY(${(1 - p) * 118}%)`;
    s.strike.style.transform = `scaleX(${prog(lt, 1.6, 2.0, eio)})`;
    s.zi.style.color = lt > 1.9 ? 'var(--mute)' : 'var(--ink)';
    const m = spring(lt - 2.2, 260, 24); s.mish.style.opacity = clamp(m * 1.5); s.mish.style.transform = `scale(${.6 + .4 * m})`;
    s.row.style.transform = `translateX(${s.shift * (1 - eio((lt - 2.1) / .7))}px)`;
  },
  cues() { return [[.5, 'hit', .9], [1.6, 'scratch', .6], [2.2, 'pop', .7]]; }
};

T.icons3 = {
  build(s) {
    s.tb = el('main', s.root); s.tb.style.fontSize = '84px'; s.tw = words(s.tb, s.title);
    const row = el('', s.root); row.style.cssText = 'display:flex;gap:70px;margin-top:30px';
    s.items = s.items.map(([ic, lab]) => {
      const c = el('card', row); c.style.cssText += ';width:380px;height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px';
      const i = icon(ic, c, 130); const l = el('', c); l.style.cssText = 'font-size:68px;font-weight:900'; l.textContent = lab;
      return { c, i };
    });
  },
  upd(s, lt) {
    animWords(s.tw, lt, .1);
    s.items.forEach((it, k) => { const t0 = 1.3 + k * 1.2; const m = spring(lt - t0); it.c.style.opacity = clamp(m * 2); it.c.style.transform = `translateY(${(1 - m) * 80}px) scale(${.85 + .15 * m})`; draw(it.i, prog(lt, t0 + .1, t0 + 1.0, eio)); });
  },
  cues() { return [[.1, 'swish', .35], [1.3, 'pop', .6], [2.5, 'pop', .6], [3.7, 'pop', .6]]; }
};

T.headlines = {
  build(s) {
    s.lb = el('small', s.root); s.lb.textContent = s.label; s.lb.style.fontSize = '40px';
    s.cards = [s.a, s.b].map((txt, k) => {
      const c = el('card', s.root); c.style.cssText += `;padding:44px 70px;font-size:76px;font-weight:900;max-width:1500px;${k ? 'color:var(--ink)' : ''}`;
      const tag = el('small', c); tag.textContent = k ? 'رأي ٢' : 'رأي ١'; tag.style.marginBottom = '6px';
      el('', c).textContent = txt; return c;
    });
  },
  upd(s, lt) {
    s.lb.style.opacity = prog(lt, .1, .8);
    s.cards.forEach((c, k) => { const t0 = .5 + k * 3.2; const m = spring(lt - t0, 170, 24); const dir = k ? -1 : 1; c.style.opacity = clamp(m * 2); c.style.transform = `translateX(${dir * (1 - m) * 260}px) rotate(${dir * -1.5}deg)`; });
  },
  cues() { return [[.5, 'whoosh', .5], [3.7, 'whoosh', .5]]; }
};

T.chapter = {
  build(s) {
    const lab = el('small', s.root); lab.textContent = 'الجزء'; lab.style.fontSize = '40px'; s.lab = lab;
    const nm = el('w', s.root, 'div'); nm.style.cssText = 'font-size:280px;font-weight:900;line-height:1.05;direction:ltr;color:transparent;-webkit-text-stroke:4px var(--acc)';
    s.num = el('wi', nm, 'span'); s.num.textContent = s.n;
    s.tb = el('main', s.root); s.tb.style.fontSize = '104px'; s.tw = words(s.tb, s.title); fit(s.tb, 1640);
  },
  upd(s, lt) {
    s.lab.style.opacity = prog(lt, .05, .6);
    const p = eo((lt - .1) / .9); s.num.style.transform = `translateY(${(1 - p) * 110}%)`;
    const f = prog(lt, 1.0, 1.8, eio); s.num.style.color = `rgba(205,242,79,${f})`;
    animWords(s.tw, lt, .55);
  },
  cues() { return [[0, 'rise', .6], [.4, 'hit', .9]]; }
};

T.typing = {
  build(s) {
    s.lb = el('sub', s.root); s.lw = words(s.lb, s.label);
    s.box = el('card', s.root); s.box.style.cssText += ';padding:50px 90px;min-width:1100px;font-size:120px;font-weight:900;display:flex;align-items:center;justify-content:flex-start;gap:6px;min-height:180px';
    s.tx = el('', s.box, 'span'); s.cr = el('', s.box, 'span'); s.cr.style.cssText = 'width:8px;height:120px;background:var(--acc);border-radius:4px;display:inline-block';
  },
  upd(s, lt) {
    animWords(s.lw, lt, .05);
    const m = spring(lt - .3, 170, 24); s.box.style.opacity = clamp(m * 2); s.box.style.transform = `translateY(${(1 - m) * 50}px)`;
    const t0 = 1.2; s.tx.textContent = typed(s.text, lt, t0, 1 / .11);
    const typing = lt > t0 && lt < t0 + s.text.length * .11; s.cr.style.opacity = caret(lt, typing);
  },
  cues(s) { const c = [[.05, 'swish', .3]]; for (let i = 0; i < s.text.length; i++) if (s.text[i] !== ' ') c.push([1.2 + i * .11, 'tick', .35]); return c; }
};

T.probs = {
  build(s) {
    s.pb = el('card', s.root); s.pb.style.cssText += ';padding:34px 80px;font-size:92px;font-weight:900;display:flex;gap:28px;align-items:center';
    el('', s.pb, 'span').textContent = s.prompt;
    const slm = el('w', s.pb, 'span'); s.slot = el('wi acc', slm, 'span'); s.slot.textContent = s.items[0][0];
    s.rows = s.items.map(([w, v]) => {
      const r = el('', s.root); r.style.cssText = 'display:grid;grid-template-columns:240px 900px 170px;align-items:center;gap:40px;font-size:76px;font-weight:900';
      const a = el('', r); a.textContent = w; a.style.textAlign = 'right';
      const tr = el('', r); tr.style.cssText = 'position:relative;height:44px;border-radius:22px;background:#1d1d22;overflow:hidden';
      const f = el('', tr); f.style.cssText = 'position:absolute;right:0;top:0;bottom:0;border-radius:22px;background:var(--mute)';
      const n = el('', r); n.style.cssText = 'direction:ltr;text-align:left;font-size:64px';
      return { r, a, f, n, v };
    });
    s.note = el('small', s.root); s.note.textContent = 'مثال توضيحي · الأرقام للتقريب';
  },
  upd(s, lt) {
    const m = spring(lt - .1, 170, 24); s.pb.style.opacity = clamp(m * 2); s.pb.style.transform = `translateY(${(1 - m) * -40}px)`;
    s.rows.forEach((r, k) => {
      const t0 = 1.0 + k * .7; const a = spring(lt - t0, 200, 24); r.r.style.opacity = clamp(a * 2) * (k && lt > 6.5 ? lerp(1, .35, prog(lt, 6.5, 7.1)) : 1); r.r.style.transform = `translateY(${(1 - a) * 40}px)`;
      const g = prog(lt, t0 + .2, t0 + 1.6, eio); r.f.style.width = (g * r.v) + '%'; r.n.textContent = Math.round(g * r.v) + '%';
      const win = !k && lt > 6.5; r.f.style.background = win ? 'var(--acc)' : 'var(--mute)'; r.a.style.color = win ? 'var(--acc)' : 'var(--ink)';
    });
    s.note.style.opacity = prog(lt, 2.5, 3.3);
    const q = eo((lt - 7.5) / .8); s.slot.style.transform = `translateY(${(1 - q) * 118}%)`;
  },
  cues() { return [[.1, 'swish', .3], [1.0, 'pop', .5], [1.7, 'pop', .5], [2.4, 'pop', .5], [6.5, 'ding', .5], [7.5, 'pop', .7]]; }
};

const FUNNEL_WORDS = ['كتب', 'مقالات', 'مواقع', 'محادثات', 'أخبار', 'قصص', 'أكواد', 'تعليقات', 'وصفات', 'أشعار', 'شروحات', 'منتديات', 'رسايل', 'كتب', 'أبحاث', 'ترجمات', 'مقالات', 'قواميس', 'مواقع', 'أسئلة', 'إجابات', 'روايات', 'محادثات', 'تقارير', 'أكواد', 'أخبار', 'قصص', 'تعليقات'];
T.funnel = {
  build(s) {
    s.tb = el('main', s.root); s.tb.style.cssText = 'font-size:88px;position:absolute;top:110px;left:0;right:0'; s.tw = words(s.tb, s.title);
    s.ring = el('', s.root); s.ring.style.cssText = 'position:absolute;left:810px;top:520px;width:300px;height:300px;border-radius:50%;border:4px solid var(--acc);box-shadow:0 0 80px rgba(205,242,79,.35),inset 0 0 60px rgba(205,242,79,.25)';
    const R = rng(7);
    s.fw = FUNNEL_WORDS.map((w, i) => {
      const e = el('', s.root); e.textContent = w; e.style.cssText = 'position:absolute;left:0;top:0;font-size:52px;font-weight:700;white-space:nowrap;color:var(--ink)';
      return { e, a0: R() * Math.PI * 2, rad: 820 + R() * 240, t0: 1.0 + i * .36, w: e.offsetWidth, h: e.offsetHeight };
    });
  },
  upd(s, lt) {
    animWords(s.tw, lt, .1);
    const rm = spring(lt - .3, 170, 24); let pulse = 0;
    s.fw.forEach(f => {
      const p = clamp((lt - f.t0) / 1.7); const vis = lt > f.t0 && p < 1; f.e.style.opacity = vis ? Math.min(prog(p, 0, .12, x => x), 1 - prog(p, .8, 1, x => x)) : 0;
      if (lt > f.t0 + 1.7) pulse += Math.exp(-(lt - f.t0 - 1.7) * 5) * .06;
      if (!vis) return;
      const a = f.a0 + 1.1 * eio(p), r = f.rad * (1 - eio(p));
      const x = 960 + Math.cos(a) * r, y = 670 + Math.sin(a) * r * .5; const sc = 1 - .75 * eio(p);
      f.e.style.transform = `translate(${x - f.w / 2}px,${y - f.h / 2}px) scale(${sc})`;
    });
    s.ring.style.transform = `scale(${rm * (1 + pulse + .02 * Math.sin(lt * 3))})`; s.ring.style.opacity = clamp(rm * 2);
  },
  cues(s) { const c = [[.1, 'swish', .3], [.3, 'rise', .4]]; FUNNEL_WORDS.forEach((_, i) => c.push([1.0 + i * .36 + 1.7, 'tick', .22])); return c; }
};

T.chain = {
  build(s) {
    s.tb = el('main', s.root); s.tb.style.fontSize = '92px'; s.tw = words(s.tb, s.title);
    const wrap = el('', s.root); wrap.style.cssText = 'position:relative;margin-top:50px';
    s.row = el('', wrap); s.row.style.cssText = 'display:flex;gap:30px;font-size:84px;font-weight:900';
    s.tk = s.toks.map(t => { const m = el('w', s.row, 'span'); m.style.margin = '-.14em 0 -.26em'; const i = el('wi', m, 'span'); i.textContent = t; return { m, i }; });
    s.ptr = el('', wrap); s.ptr.style.cssText = 'position:absolute;top:150px;left:0;font-size:36px;font-weight:700;color:var(--acc);white-space:nowrap;text-align:center';
    s.ptr.innerHTML = '<div style="font-size:44px;line-height:1">&#9650;</div>الكلمة اللي بعدها';
    if (s.row.offsetWidth > 1640) s.row.style.fontSize = (84 * 1640 / s.row.offsetWidth) + 'px';
    s.pw = s.ptr.offsetWidth; s.cx = s.tk.map(t => t.m.offsetLeft + t.m.offsetWidth / 2);
  },
  upd(s, lt) {
    animWords(s.tw, lt, .1);
    let cur = -1;
    s.tk.forEach((t, k) => { const t0 = 1.6 + k * 1.55; const p = eo((lt - t0) / .7); t.i.style.transform = `translateY(${(1 - p) * 118}%)`; if (lt >= t0) cur = k; });
    s.tk.forEach((t, k) => t.i.style.color = k === cur ? 'var(--acc)' : 'var(--ink)');
    if (cur < 0) { s.ptr.style.opacity = 0; return; }
    let x = s.cx[0]; for (let k = 1; k <= cur; k++) { const t0 = 1.6 + k * 1.55; x += (s.cx[k] - s.cx[k - 1]) * spring(lt - t0, 170, 24); }

const CHAPS = [[60, '01', 'بيشتغل إزاي'], [165, '02', 'بيعمل إيه وبيغلط في إيه'], [255, '03', 'هياخد شغلك؟'], [360, '04', '3 حاجات من النهارده'], [435, '', '']];
// orb keyframes: per scene type
const ORB = S.map(s => {
  const R = rng(Math.round(s.t0 * 10));
  if (s.type === 'funnel') return [s.t0, 960, 670, 1.4];
  if (s.type === 'chapter') return [s.t0, 960, 470, 1.25];
  if (s.hero) return [s.t0, 960, 540, 1.35];
  return [s.t0, 660 + R() * 600, 380 + R() * 320, .8 + R() * .3];
});

// ---------- build + seek ----------
const chapB = document.querySelector('#chap b'), chapS = document.querySelector('#chap span');
const orb = document.getElementById('orb'), dots = document.getElementById('dots'), fade = document.getElementById('fade');
const gc = document.getElementById('grain'), gx = gc.getContext('2d'), gimg = gx.createImageData(480, 270);
function grain(t) {
  const r = rng(Math.floor(t * 15) + 99), d = gimg.data;
  for (let i = 0; i < d.length; i += 4) { const v = r() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  gx.putImageData(gimg, 0, 0);
}
function buildAll() {
  S.forEach((s, i) => { s.root = el('sc', stage); s.root.style.zIndex = 10; T[s.type].build(s); s.root.style.display = 'none'; });
  window.CUES = [];
  S.forEach(s => T[s.type].cues(s).forEach(([lt, k, g]) => { if (lt < s.t1 - s.t0) CUES.push([+(s.t0 + lt).toFixed(3), k, g]); }));
  CUES.sort((a, b) => a[0] - b[0]);
}
let ready = false;
window.seek = (t) => {
  // background
  dots.style.transform = `translate(${(-t * 7) % 44}px,${(-t * 3.5) % 44}px)`;
  grain(t);
  // orb
  let k = 0; while (k + 1 < ORB.length && ORB[k + 1][0] <= t) k++;
  const cur = ORB[k], prev = ORB[Math.max(0, k - 1)], p = eio((t - cur[0]) / 1.4);
  const ox = lerp(prev[1], cur[1], p), oy = lerp(prev[2], cur[2], p), os = lerp(prev[3], cur[3], p) * (1 + .04 * Math.sin(t * 1.3));
  orb.style.transform = `translate(${ox}px,${oy}px) scale(${os})`;
  // chapter tag
  let ch = null; CHAPS.forEach(c => { if (t >= c[0] + 5) ch = c; });
  const chOn = ch && ch[1] ? 1 : 0; chapB.textContent = ch ? ch[1] : ''; chapS.textContent = ch ? ch[2] : '';
  const sinceCh = ch ? t - ch[0] - 5 : 0; document.getElementById('chap').style.opacity = chOn * clamp(sinceCh / .6);
  // scenes
  S.forEach(s => {
    const lt = t - s.t0, d = s.t1 - s.t0;
    if (lt < -0.001 || lt >= d) { if (s.root.style.display !== 'none') s.root.style.display = 'none'; return; }
    s.root.style.display = 'flex';
    T[s.type].upd(s, lt, d);
    const isLast = s === S[S.length - 1];
    const x = isLast ? 0 : prog(lt, d - .45, d, ei);
    s.root.style.opacity = 1 - x;
    s.root.style.transform = `translateY(${-x * 50}px) scale(${1 + .018 * lt / d})`;
    s.root.style.filter = x > 0 ? `blur(${x * 8}px)` : 'none';
  });
  fade.style.opacity = prog(t, DUR - 1.2, DUR, x => clamp(x));
};
document.fonts.ready.then(() => Promise.all([400, 700, 900].map(w => document.fonts.load(`${w} 40px K`, 'الذكاء AI 01')))).then(() => {
  buildAll(); seek(0); window.ready = true;
});
// preview: space = play/pause, arrows = +-1s, ?t=
let playing = false, t0w = 0, tcur = +(new URLSearchParams(location.search).get('t') || 0);
addEventListener('keydown', e => {
  if (e.code === 'Space') { playing = !playing; t0w = performance.now() / 1000 - tcur; if (playing) requestAnimationFrame(loop); }
  if (e.code === 'ArrowLeft') { tcur = Math.max(0, tcur - 1); seek(tcur); }
  if (e.code === 'ArrowRight') { tcur = Math.min(DUR, tcur + 1); seek(tcur); }
});
function loop() { if (!playing) return; tcur = performance.now() / 1000 - t0w; if (tcur > DUR) { playing = false; return; } seek(tcur); requestAnimationFrame(loop); }
</script>
